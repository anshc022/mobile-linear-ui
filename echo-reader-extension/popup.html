<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      width: 320px; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e; 
      color: #fff; 
      padding: 20px;
    }
    .logo { text-align: center; margin-bottom: 15px; }
    .logo h1 { font-size: 22px; color: #00d4ff; }
    .logo span { font-size: 12px; color: #888; }
    .status { 
      background: #16213e; 
      border-radius: 8px; 
      padding: 12px; 
      margin-bottom: 15px;
      font-size: 13px;
      color: #aaa;
      text-align: center;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .status.success { color: #4ade80; background: #0a2e1a; }
    .status.error { color: #f87171; background: #2e0a0a; }
    .status.loading { color: #facc15; }
    btn { 
      width: 100%; 
      padding: 14px; 
      border: none; 
      border-radius: 10px; 
      font-size: 15px; 
      font-weight: 600; 
      cursor: pointer; 
      margin-bottom: 10px;
      transition: all 0.2s;
    }
    .btn-primary { background: #00d4ff; color: #000; }
    .btn-primary:hover { background: #00b8e6; }
    .btn-secondary { background: #16213e; color: #fff; border: 1px solid #333; }
    .btn-secondary:hover { background: #1a2744; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .info { font-size: 11px; color: #555; text-align: center; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="logo">
    <h1>⚡ Echo Reader</h1>
    <span>Send page content to Echo</span>
  </div>
  
  <div class="status" id="status">Ready — click a button below</div>
  
  <button class="btn btn-primary" id="sendFull">📄 Send Full Page</button>
  <button class="btn btn-secondary" id="sendSelected">✂️ Send Selected Text</button>
  <button class="btn btn-secondary" id="sendQuiz">🎯 Extract Quiz/Questions</button>
  <button class="btn btn-secondary" id="sendScreenshot">📸 Send Screenshot</button>
  
  <div class="info">Content is sent to Echo via Discord</div>
  
  <script src="popup.js"></script>
</body>
</html>
