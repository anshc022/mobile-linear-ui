<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f1a; 
      color: #fff; 
      padding: 16px;
      min-height: 100vh;
    }
    .header { text-align: center; padding: 20px 0; border-bottom: 1px solid #222; margin-bottom: 16px; }
    .header h1 { font-size: 20px; color: #00d4ff; margin-bottom: 4px; }
    .header span { font-size: 12px; color: #666; }
    
    .status { 
      background: #16213e; 
      border-radius: 10px; 
      padding: 12px; 
      margin-bottom: 16px;
      font-size: 13px;
      color: #aaa;
      text-align: center;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
    }
    .status.success { color: #4ade80; background: #0a2e1a; }
    .status.error { color: #f87171; background: #2e0a0a; }
    .status.loading { color: #facc15; background: #2e2a0a; }
    
    .btn-group { display: flex; flex-direction: column; gap: 10px; }
    .btn { 
      width: 100%; 
      padding: 14px 16px; 
      border: none; 
      border-radius: 12px; 
      font-size: 14px; 
      font-weight: 600; 
      cursor: pointer; 
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    
    .btn-primary { background: #00d4ff; color: #000; }
    .btn-primary:hover { background: #00b8e6; box-shadow: 0 4px 15px rgba(0,212,255,0.3); }
    
    .btn-secondary { background: #1a2744; color: #fff; border: 1px solid #2a3a5c; }
    .btn-secondary:hover { background: #223050; border-color: #3a5a8c; }
    
    .btn-icon { font-size: 18px; }
    
    .divider { height: 1px; background: #222; margin: 20px 0; }
    
    .log { margin-top: 16px; }
    .log h3 { font-size: 13px; color: #555; margin-bottom: 8px; }
    .log-entries { 
      max-height: 200px; 
      overflow-y: auto; 
      font-size: 12px; 
      color: #666;
      background: #111;
      border-radius: 8px;
      padding: 10px;
    }
    .log-entry { padding: 4px 0; border-bottom: 1px solid #1a1a1a; }
    .log-entry:last-child { border: none; }
    .log-entry .time { color: #444; }
    .log-entry .ok { color: #4ade80; }
    .log-entry .fail { color: #f87171; }
    
    .info { font-size: 11px; color: #333; text-align: center; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>⚡ Echo Reader</h1>
    <span>Side Panel — stays open while you browse</span>
  </div>
  
  <div class="status" id="status">Ready — click a button below</div>
  
  <div class="btn-group">
    <button class="btn btn-primary" id="sendFull">
      <span class="btn-icon">📄</span> Send Full Page
    </button>
    <button class="btn btn-secondary" id="sendSelected">
      <span class="btn-icon">✂️</span> Send Selected Text
    </button>
    <button class="btn btn-secondary" id="sendQuiz">
      <span class="btn-icon">🎯</span> Extract Quiz/Questions
    </button>
    <button class="btn btn-secondary" id="sendScreenshot">
      <span class="btn-icon">📸</span> Send Screenshot
    </button>
  </div>
  
  <div class="divider"></div>
  
  <div class="log">
    <h3>Activity Log</h3>
    <div class="log-entries" id="logEntries">
      <div class="log-entry"><span class="time">—</span> No activity yet</div>
    </div>
  </div>
  
  <div class="info">Content is sent to Echo via #echo-reader</div>
  
  <script src="panel.js"></script>
</body>
</html>
